name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: geostamp-lockfile-bootstrap
          path: package-lock.json
          retention-days: 1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Dependency audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "try { const r = require('./npm-audit.json'); console.log(JSON.stringify({ vulnerabilities: r.metadata?.vulnerabilities ?? null, packages: Object.entries(r.vulnerabilities ?? {}).map(([name, item]) => ({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable })) }, null, 2)); } catch { console.error('Dependency audit report could not be parsed; inspect npm output and network availability.'); process.exitCode = 0; }"
      - name: Upload dependency audit report
        if: always() && hashFiles('npm-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit generated lockfile (one-time bootstrap)
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'security-hardening-2026-10' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "chore: commit reproducible npm lockfile"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:${GITHUB_HEAD_REF}"

